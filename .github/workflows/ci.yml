name: CI Java

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cv-search

    steps:
      - name: Récupération du projet
        uses: actions/checkout@v6

      - name: Installation de Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilation et tests
        run: mvn -B clean test